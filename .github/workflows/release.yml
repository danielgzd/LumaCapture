name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Core regression tests
        run: scripts/test.sh
      - name: Intel cross-compilation tests
        run: scripts/test.sh --arch x86_64 --portable
      - name: Configure release signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" || -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" || -z "$MACOS_SIGN_IDENTITY" || -z "$APPLE_TEAM_ID" ]]; then
            echo 'Developer ID signing secrets are incomplete. Building an ad-hoc signed release; macOS permissions may need to be granted again after updates.' >&2
            echo 'SIGN_IDENTITY=-' >> "$GITHUB_ENV"
            echo 'REQUIRE_STABLE_SIGNATURE=0' >> "$GITHUB_ENV"
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/lumacapture-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "EXPECTED_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo 'REQUIRE_STABLE_SIGNATURE=1' >> "$GITHUB_ENV"
      - name: Build and verify release archives
        run: scripts/build.sh --self-test --version "$VERSION"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --notes-file .github/RELEASE_NOTES.md --title "LumaCapture $VERSION"
          fi
          gh release upload "$RELEASE_TAG" "dist/LumaCapture-$VERSION-universal.zip" "dist/LumaCapture-$VERSION-universal.dmg" "dist/LumaCapture-$VERSION-universal.sha256" --clobber
