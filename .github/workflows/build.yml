name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Core regression tests
        run: ./scripts/test.sh
      - name: Universal app and synthetic integration checks
        run: ./scripts/build.sh --self-test
      - name: Retain macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LumaCapture-universal
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
            .build/self-test/**
          if-no-files-found: error
          retention-days: 14
