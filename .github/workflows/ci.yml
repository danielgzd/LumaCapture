name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'scripts/**'
      - 'Package.swift'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional exact version to release, for example 1.0.0
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Core behavior tests
        run: scripts/test.sh
      - name: Intel cross-compilation tests
        run: scripts/test.sh --arch x86_64 --portable
      - name: Synthetic 4K editor performance baseline
        run: scripts/benchmark-editor.sh
      - name: Universal application and self-test
        run: scripts/build.sh --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: LumaCapture-universal
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
            .build/self-test/**
            .build/benchmarks/editor-benchmark.json
          if-no-files-found: error
          retention-days: 14

  version-and-release:
    needs: build-and-test
    if: github.event_name == 'push' || inputs.release_version != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    concurrency:
      group: luma-version-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release signing configuration
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [[ -n "$MACOS_CERTIFICATE" ]] || missing+=(MACOS_CERTIFICATE)
          [[ -n "$MACOS_CERTIFICATE_PASSWORD" ]] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [[ -n "$KEYCHAIN_PASSWORD" ]] || missing+=(KEYCHAIN_PASSWORD)
          [[ -n "$MACOS_SIGN_IDENTITY" ]] || missing+=(MACOS_SIGN_IDENTITY)
          [[ -n "$APPLE_TEAM_ID" ]] || missing+=(APPLE_TEAM_ID)
          if (( ${#missing[@]} > 0 )); then
            printf 'Release signing secrets are missing: %s\n' "${missing[*]}" >&2
            printf 'No version tag was created. See docs/RELEASE_SIGNING.md.\n' >&2
            exit 1
          fi
      - name: Choose version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tag="v$REQUESTED_VERSION"
          else
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ -z "$latest" ]]; then
              tag='v0.1.0'
            else
              version="${latest#v}"
              IFS=. read -r major minor patch <<< "$version"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" -m "LumaCapture ${TAG#v}"
          git push origin "$TAG"
      - name: Start release build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref main -f tag="$TAG"
